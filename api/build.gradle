plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.min'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

springBoot {
    mainClass = 'com.min.meow.MeowApplication'
}

// Spring Boot 3.4.5 BOM이 관리하는 testcontainers 1.20.x는 Docker Engine v29(Docker Desktop 4.52+)와
// API 버전 협상이 안 되는 알려진 버그가 있음(docker-java가 API 1.32로 협상 시도 → v29가 거부).
// 2.0.2부터 수정되어 2.0.5로 명시적 오버라이드. (2.0부터 artifactId에 testcontainers- 접두사 붙음)
ext['testcontainers.version'] = '2.0.5'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {

    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // JPA 관련 (QueryDSL 사용을 위해 필요)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.0'

    // Hibernate Spatial: MySQL POINT 컬럼 ↔ JTS Point 객체 자동 매핑 지원
    // - 위치 기반 조회(ST_Distance_Sphere)와 SPATIAL INDEX 활용을 위해 필요
    // - Spring Boot 3.4 (Hibernate 6.x)는 ORM 코어와 통합되어 별도 dialect 설정 불필요
    implementation 'org.hibernate.orm:hibernate-spatial'

    // QueryDSL
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Testcontainers: 통합 테스트에서 로컬에 떠있는 Redis에 의존하지 않고
    // JVM 시작 시 Docker로 임시 Redis 컨테이너를 띄워 사용 (버전은 Spring Boot BOM이 관리)
    testImplementation 'org.testcontainers:testcontainers'
    // 2.0부터 artifactId에 testcontainers- 접두사가 붙음 (패키지 경로는 동일)
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'

    // oauth2
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // S3
    implementation 'software.amazon.awssdk:s3:2.20.45'
    implementation 'software.amazon.awssdk:auth:2.20.45'

    // redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'org.redisson:redisson-spring-boot-starter:3.27.2'

    // 재시도 처리 (@Retryable)
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework:spring-aspects'

    // 모니터링 - Actuator & Prometheus
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus:1.12.13'


    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

    // jwt
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

    // db
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'com.h2database:h2:2.3.230'
    // Flyway: DB 스키마 마이그레이션 관리 (MySQL 전용 파서 지원 포함)
    implementation 'org.flywaydb:flyway-mysql'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
    }
}

// QueryDSL Q클래스 생성 디렉토리 설정
def generated = file("src/main/generated")

sourceSets {
    main {
        java {
            srcDir generated
        }
    }
}

// UTF-8 인코딩 설정 + QueryDSL 생성 경로
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.annotationProcessorGeneratedSourcesDirectory = generated
}

// clean 시 generated 폴더도 삭제
clean {
    delete generated
}