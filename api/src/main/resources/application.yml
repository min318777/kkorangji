server:
  # nginx가 넘겨주는 X-Forwarded-Proto/Host를 신뢰 — OAuth2 redirect-uri의 {baseUrl}이
  # http://...:8080이 아니라 실제 요청받은 https 도메인으로 정확히 계산되도록 함
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: 50       # 최대 워커 스레드 수 (t3.small 2코어 기준)
      min-spare: 10 # 최소 유지 스레드 수
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true

spring:
  jmx:
    enabled: true  # Tomcat 스레드 메트릭 수집용
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  application:
    name: meow

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/meow}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:${MYSQL_ROOT_PASSWORD:}}
    hikari:
      maximum-pool-size: 15      # 최대 DB 커넥션 수 (t3.small max_connections 225 기준)
      minimum-idle: 5            # 평상시 유지 커넥션
      connection-timeout: 5000  # 30초 내 못 얻으면 실패
      max-lifetime: 1800000      # 30분마다 재생성 (AWS RDS idle 끊김 방지)
      idle-timeout: 600000       # 10분 유휴 시 커넥션 반납
      keepalive-time: 60000      # 60초마다 SELECT 1 (끊어진 연결 방지)
      leak-detection-threshold: 5000  # 5초 이상 미반환 시 경고 로그

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true  # 기존 DB를 V1 베이스라인으로 처리 (첫 적용 시 현재 상태를 완료로 표시)
    baseline-version: 1

  cache:
    type: redis
    redis:
      time-to-live: 3600

  data:
    redis:
      host: redis
      port: 6379
      password: ""
      repositories:
        enabled: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-name: Google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "http://localhost:8080/login/oauth2/code/google"
            authorization-grant-type: authorization_code
            scope:
              - profile
              - email
          kakao:
            client-name: Kakao
            client-id: ${KAKAO_CLIENT_ID:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET}
  access-ttl-minutes: 30
  refresh-ttl-days: 14
  issuer: meow-api
  audience: meow-client

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET:}
      baseUrl: ${AWS_S3_BASE_URL:}
    cloudfront:
      domain: ${AWS_CLOUDFRONT_DOMAIN:}  # 예: https://d1234abcd.cloudfront.net
    region: ${AWS_REGION:ap-northeast-2}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}

logging:
  level:
    root: INFO
    com.min.meow: DEBUG          # 내 코드는 DEBUG까지 출력 (로컬 기본값)
    org.hibernate.SQL: OFF       # p6spy가 SQL 출력하므로 중복 방지
    org.springframework.security: INFO
    io.lettuce: WARN             # Redis 클라이언트 노이즈 억제
    org.apache.kafka: WARN       # Kafka 라이브러리 노이즈 억제

# Actuator 및 Prometheus 설정
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics  # 외부에 노출할 엔드포인트
      base-path: /actuator  # 엔드포인트 기본 경로
  endpoint:
    health:
      show-details: always  # 상세 헬스체크 정보 표시
    prometheus:
      enabled: true  # Prometheus 엔드포인트 활성화
  metrics:
    tags:
      application: ${spring.application.name}  # 메트릭에 애플리케이션 이름 태그 추가
    distribution:
      percentiles-histogram:
        http.server.requests: true  # p95 계산용 _bucket 메트릭 생성
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1000ms  # SLO 구간별 카운트
    enable:
      tomcat: true  # Tomcat 스레드 메트릭 활성화
    export:
      prometheus:
        enabled: true  # Prometheus 메트릭 내보내기 활성화
