server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  application:
    name: meow

  datasource:
    url: jdbc:mysql://mysql:3306/meow
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${MYSQL_ROOT_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
      database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  cache:
    type: redis
    redis:
      time-to-live: 3600

  data:
    redis:
      host: redis
      port: 6379
      password: ""
      repositories:
        enabled: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-name: Google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "http://localhost:8080/login/oauth2/code/google"
            authorization-grant-type: authorization_code
            scope:
              - profile
              - email

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

jwt:
  secret: ${JWT_SECRET}
  access-ttl-minutes: 30
  refresh-ttl-days: 14
  issuer: meow-api
  audience: meow-client

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET:}
      baseUrl: ${AWS_S3_BASE_URL:}
    cloudfront:
      domain: ${AWS_CLOUDFRONT_DOMAIN:}  # 예: https://d1234abcd.cloudfront.net
    region: ${AWS_REGION:ap-northeast-2}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}

logging:
  level:
    root: INFO
    com.min.meow: DEBUG          # 내 코드는 DEBUG까지 출력 (로컬 기본값)
    org.hibernate.SQL: OFF       # p6spy가 SQL 출력하므로 중복 방지
    org.springframework.security: INFO
    io.lettuce: WARN             # Redis 클라이언트 노이즈 억제
    org.apache.kafka: WARN       # Kafka 라이브러리 노이즈 억제

# Actuator 및 Prometheus 설정
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics  # 외부에 노출할 엔드포인트
      base-path: /actuator  # 엔드포인트 기본 경로
  endpoint:
    health:
      show-details: always  # 상세 헬스체크 정보 표시
    prometheus:
      enabled: true  # Prometheus 엔드포인트 활성화
  metrics:
    tags:
      application: ${spring.application.name}  # 메트릭에 애플리케이션 이름 태그 추가
    export:
      prometheus:
        enabled: true  # Prometheus 메트릭 내보내기 활성화
