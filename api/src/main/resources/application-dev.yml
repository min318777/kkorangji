# 로컬 개발용 설정 (docker-compose.dev.yml과 함께 사용)
# 인프라는 Docker로, 애플리케이션은 로컬에서 실행할 때 사용
# 실행 방법: ./gradlew :api:bootRun --args='--spring.profiles.active=dev'

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  application:
    name: meow

  # MySQL - localhost:3307로 접근 (Docker 포트 매핑)
  datasource:
    url: jdbc:mysql://localhost:3307/meow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: min3782
    hikari:
      maximum-pool-size: 13          # 최대 DB Connection 수 (6코어 × 2 + SSD 1 = 13)
      minimum-idle: 5                # 유휴 시 최소 커넥션
      connection-timeout: 30000      # 30초 내 못 얻으면 실패
      max-lifetime: 1800000          # 30분마다 커넥션 재생성
      idle-timeout: 600000           # 10분 유휴 시 커넥션 정리
      keepalive-time: 60000          # 60초마다 SELECT 1로 연결 확인
      leak-detection-threshold: 2000 # 2초 이상 미반환 시 경고 로그

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false

  cache:
    type: redis
    redis:
      time-to-live: 3600

  # Redis - localhost:6379로 접근
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      repositories:
        enabled: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-name: Google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "http://localhost:8080/login/oauth2/code/google"
            authorization-grant-type: authorization_code
            scope:
              - profile
              - email

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

jwt:
  secret: ${JWT_SECRET}

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET:}
      baseUrl: ${AWS_S3_BASE_URL:}
    cloudfront:
        domain: ${AWS_CLOUDFRONT_DOMAIN:}
    region: ${AWS_REGION:ap-northeast-2}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}

logging:
  level:
    root: INFO
    com.min.meow: INFO           # 배포 환경: INFO만 (DEBUG 끔)
    org.hibernate.SQL: OFF
    io.lettuce: WARN
    org.apache.kafka: WARN
  file:
    name: logs/meow.log          # 파일 저장 경로
  logback:
    rollingpolicy:
      max-file-size: 10MB        # 10MB마다 새 파일
      max-history: 7             # 7일치만 보관
      total-size-cap: 1GB        # 전체 최대 1GB

# Actuator 및 Prometheus 설정 (개발 환경)
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics  # 외부에 노출할 엔드포인트
      base-path: /actuator
  endpoint:
    health:
      show-details: always  # 상세 헬스체크 정보 표시
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}  # 메트릭에 애플리케이션 이름 태그 추가
    export:
      prometheus:
        enabled: true