spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  application:
    name: meow

  datasource:
    url: jdbc:mysql://localhost:3307/meow
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 15          # prod와 동일 환경 (t3.small 기준)
      minimum-idle: 5                # 평상시 유지 커넥션
      connection-timeout: 5000     # 30초 내 못 얻으면 실패 (pool_timeout=30)
      max-lifetime: 1800000          # 30분마다 커넥션 재생성 (pool_recycle=1800)
      idle-timeout: 600000           # 10분 유휴 시 커넥션 정리
      keepalive-time: 60000          # 60초마다 SELECT 1로 연결 확인 (pool_pre_ping=True)
      leak-detection-threshold: 5000 # 5초 이상 미반환 시 경고 로그

  jpa:
    hibernate:
      ddl-auto: update
      database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false

  cache:
    type: redis
    redis:
      time-to-live: 3600

  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      repositories:
        enabled: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-name: Google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "http://localhost:8080/login/oauth2/code/google"
            authorization-grant-type: authorization_code
            scope:
              - profile
              - email

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

jwt:
  secret: ${JWT_SECRET}

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET:}
      baseUrl: ${AWS_S3_BASE_URL:}
    cloudfront:
        domain: ${AWS_CLOUDFRONT_DOMAIN:}
    region: ${AWS_REGION:ap-northeast-2}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}

# Actuator 및 Prometheus 설정 (로컬 환경)
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics  # 외부에 노출할 엔드포인트
      base-path: /actuator  # 엔드포인트 기본 경로
  endpoint:
    health:
      show-details: always  # 상세 헬스체크 정보 표시
    prometheus:
      enabled: true  # Prometheus 엔드포인트 활성화
  metrics:
    tags:
      application: ${spring.application.name}  # 메트릭에 애플리케이션 이름 태그 추가
    export:
      prometheus:
        enabled: true  # Prometheus 메트릭 내보내기 활성화
