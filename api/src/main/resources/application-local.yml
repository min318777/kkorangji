spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  application:
    name: meow

  datasource:
    url: jdbc:mysql://mysql:3306/meow
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: min3782

  jpa:
    hibernate:
      ddl-auto: update
      database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  cache:
    type: redis
    redis:
      time-to-live: 3600

  data:
    redis:
      host: redis
      port: 6379
      password: ""
      repositories:
        enabled: false

  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.min.kafka.dto"
        spring.json.value.default.type: com.min.kafka.dto.NotificationDto
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  security:
    oauth2:
      client:
        registration:
          google:
