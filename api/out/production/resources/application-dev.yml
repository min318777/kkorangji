# 로컬 개발용 설정 (docker-compose.dev.yml과 함께 사용)
# 인프라는 Docker로, 애플리케이션은 로컬에서 실행할 때 사용
# 실행 방법: ./gradlew :api:bootRun --args='--spring.profiles.active=dev'

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  application:
    name: meow

  # MySQL - localhost:3307로 접근 (Docker 포트 매핑)
  datasource:
    url: jdbc:mysql://localhost:3307/meow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: min3782

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  cache:
    type: redis
    redis:
      time-to-live: 3600

  # Redis - localhost:6379로 접근
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      repositories:
        enabled: false

  # Kafka - localhost:9092로 접근
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.min.kafka.dto"
        spring.json.value.default.type: com.min.kafka.dto.NotificationDto
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  security:
    oauth2:
      client:
        registration:
          google:
            client-name: Google
            client-id: 647042100012-18jjd3m439a5nb8il0gfd5qq7d7gq6tt.apps.googleusercontent.com
            client-secret: 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
            redirect-uri: "http://localhost:8080/login/oauth2/code/google"
            authorization-grant-type: authorization_code
            scope:
              - profile
              - email

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

jwt:
  secret: "3LmMxJzOZLx6E4msrDzXQY0FfAdrsV+EoV6yg2ovF2E=1dsd"

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET:}
      baseUrl: ${AWS_S3_BASE_URL:}
    region: ${AWS_REGION:ap-northeast-2}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}

# Actuator 및 Prometheus 설정 (개발 환경)
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics  # 외부에 노출할 엔드포인트
      base-path: /actuator
  endpoint:
    health:
      show-details: always  # 상세 헬스체크 정보 표시
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}  # 메트릭에 애플리케이션 이름 태그 추가
    export:
      prometheus:
        enabled: true