name: CD

on:
  push:
    branches: [main]
    paths:
      - 'api/src/**'
      - 'api/build.gradle'
      - 'api/Dockerfile'
      - 'docker-compose.prod.yml'
      - 'nginx/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}  # min318777/meow

jobs:
  # ===========================================
  # Job 1: Docker 이미지 빌드 & GHCR 푸시
  # ===========================================
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write  # GHCR 푸시 권한

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # 자동 제공 (별도 설정 불필요)

      - name: 이미지 태그 자동 생성
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=              # 커밋 SHA (정확한 추적용)
            type=ref,event=branch         # 브랜치명 (main)
            type=raw,value=latest,enable={{is_default_branch}}  # latest

      - name: 이미지 빌드 및 GHCR 푸시
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 푸시된 이미지 태그 출력
        run: echo "${{ steps.meta.outputs.tags }}"

  # ===========================================
  # Job 2: EC2 배포
  # ===========================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push  # 이미지 푸시 완료 후 실행

    steps:
      - name: EC2 SSH 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/meow
            export IMAGE_TAG=${{ github.sha }}
            IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.prod.yml pull
            IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

      - name: 헬스체크
        run: |
          sleep 30
          for i in {1..5}; do
            if curl -sf http://${{ secrets.EC2_HOST }}/actuator/health; then
              echo "헬스체크 통과"
              exit 0
            fi
            echo "대기 중... ($i/5)"
            sleep 10
          done
          echo "헬스체크 실패"
          exit 1
