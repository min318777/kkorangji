name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 PR에서 새 커밋 푸시 시 이전 실행 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================
  # Job 1: Gradle 빌드 검증 (푸시 없음)
  # ===========================================
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Gradle 빌드 (테스트 제외)
        run: |
          chmod +x ./gradlew
          ./gradlew :api:build -x test --no-daemon
