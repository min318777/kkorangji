services:
  api:
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      # Docker 내부에서는 서비스명으로 접근 (localhost 아님)
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/meow
      SPRING_DATA_REDIS_HOST: redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Spring Boot 기동 시간 고려
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2.0'    # t3.small: 2 vCPU
          memory: 2g     # t3.small: 2GB RAM

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --ngram-token-size=2
      - --innodb-ft-min-token-size=2
      - --bind-address=0.0.0.0
      - --slow-query-log=1
      - --slow-query-log-file=/var/lib/mysql/slow.log
      - --long-query-time=1
      - --log-queries-not-using-indexes=1
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'   # db.t3.micro: 2 vCPU
          memory: 2g    # db.t3.micro: 2GB RAM

  redis:
    image: redis:7.0
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  # Node Exporter - 호스트 시스템 메트릭 수집 (CPU, 메모리, 디스크)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped

  # Prometheus - 메트릭 수집 및 저장
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    ports:
      - "9090:9090"  # Prometheus UI 접속 포트
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml  # 설정 파일 마운트
      - prometheus_data:/prometheus  # 메트릭 데이터 영속화
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'        # 설정 파일 경로
      - '--storage.tsdb.path=/prometheus'                      # 데이터 저장 경로
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'                               # API를 통한 설정 리로드 활성화
      - '--storage.tsdb.retention.time=15d'                    # 메트릭 보존 기간 (15일)
    depends_on:
      - api
    restart: unless-stopped

  # Grafana - 메트릭 시각화 대시보드
  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    ports:
      - "3001:3000"  # Grafana UI 접속 포트 (React가 3000을 사용할 수 있으므로 3001로 설정)
    env_file:
      - .env.local
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false           # 회원가입 비활성화
      - GF_SERVER_ROOT_URL=http://localhost:3001  # 루트 URL 설정
    volumes:
      - grafana_data:/var/lib/grafana                                          # Grafana 데이터 영속화
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning            # 프로비저닝 설정
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  prometheus_data:    # Prometheus 메트릭 데이터 저장
  grafana_data:       # Grafana 설정 및 대시보드 저장
