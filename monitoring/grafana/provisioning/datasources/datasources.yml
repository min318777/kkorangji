# Grafana 데이터소스 자동 프로비저닝 설정
# Prometheus를 기본 데이터소스로 설정

apiVersion: 1

datasources:
  # Prometheus 데이터소스
  - name: Prometheus
    type: prometheus
    uid: PBFA97CFB590B2093
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      # 시간 범위 설정
      timeInterval: "15s"
      # HTTP 메서드 설정
      httpMethod: POST
