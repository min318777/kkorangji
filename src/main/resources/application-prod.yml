spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    out-of-order: true  # V5 placeholder가 V6~V13 이후에 적용되도록 허용

# 소셜 로그인 성공 후 리다이렉트할 프론트엔드 주소
app:
  frontend-url: ${FRONTEND_URL:https://kkorangji.com}

cookie:
  secure: true # HTTPS 강제 - Refresh Token 평문 노출 방지

# application.yml의 com.min.meow: DEBUG(로컬 기본값)를 prod에서 명시적으로 override
# 안 하면 logging.level 프로퍼티가 logback-spring.xml의 prod INFO 설정보다 우선 적용될 수 있음
logging:
  level:
    com.min.meow: INFO

sentry:
  enabled: true
  dsn: ${SENTRY_DSN}
