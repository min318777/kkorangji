spring:
  # H2 인메모리 데이터베이스 사용 (테스트 격리)
  # NON_KEYWORDS=USER: H2 MySQL 모드에서 'user'가 예약어로 처리되는 문제 해결
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop   # 테스트 시작/종료 시 스키마 자동 생성·삭제
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false            # 테스트 중 SQL 출력 최소화
    open-in-view: false        # 통합 테스트에서 OSIV 비활성화 (LazyInitializationException 방지)

  # Redis: CacheErrorHandler가 에러를 무시하고 DB fallback 처리
  data:
    redis:
      host: localhost
      port: 6379

  # Kafka bootstrap-servers 더미값 — KafkaConsumerConfig의 @Value 바인딩 필요
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      # 테스트 환경에서 Kafka 리스너 자동 시작 비활성화 (Kafka 서버 없어도 컨텍스트 로딩 성공)
      auto-startup: false

  # Flyway 비활성화: H2에서 MySQL 전용 SQL(WITH PARSER ngram) 실행 방지
  flyway:
    enabled: false

  # Kafka 자동 설정 비활성화 (KafkaAutoConfiguration의 자동 Producer/Consumer Factory 제외)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  # OAuth2 클라이언트 설정 (더미값 — 실제 연동 불필요)
  # kakao도 반드시 필요: application.yml에 등록된 registration은 client-id가 비어있으면
  # (KAKAO_CLIENT_ID 환경변수 미설정 시 기본값 "") 테스트 프로파일에서도 컨텍스트 로딩 자체가 실패함
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope: email, profile
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret

# JWT 시크릿 및 설정 (테스트용 — 충분한 길이의 더미값)
jwt:
  secret: dGVzdFNlY3JldEtleUZvclRlc3RpbmdQdXJwb3NlT25seVRoaXNJc0xvbmdFbm91Z2g=
  access-ttl-minutes: 30
  refresh-ttl-days: 14
  issuer: meow-api
  audience: meow-client

# AWS S3 설정 (테스트용 더미값)
cloud:
  aws:
    s3:
      bucket: test-bucket
    region:
      static: ap-northeast-2
    stack:
      auto: false
    credentials:
      access-key: test-access-key
      secret-key: test-secret-key

# 로깅 레벨 조정
logging:
  level:
    com.min.meow: DEBUG
    org.springframework.security: DEBUG
