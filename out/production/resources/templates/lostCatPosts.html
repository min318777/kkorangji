<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>분실 고양이 목록</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f9fafb; /* 부드러운 회색 배경 */
            font-family: 'Arial', sans-serif;
        }
        .card {
            transition: transform 0.2s;
        }
        .card:hover {
            transform: scale(1.02);
        }
        /* 고대비 포커스 스타일 */
        a:focus, button:focus {
            outline: 3px solid #f97316;
            outline-offset: 2px;
        }
        /* 이미지 스타일 */
        .cat-image {
            object-fit: cover;
            height: 200px;
            width: 100%;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
<!-- 헤더 -->
<header class="bg-amber-100 p-6 shadow-md">
    <h1 class="text-3xl font-bold text-amber-800 text-center">분실 고양이 목록</h1>
    <p class="text-amber-600 text-center mt-2">사랑하는 고양이를 찾아드립니다 🐾</p>
</header>

<!-- 메인 콘텐츠 -->
<main class="flex-grow max-w-6xl mx-auto p-6">
    <section aria-labelledby="posts-heading">
        <h2 id="posts-heading" class="text-2xl font-semibold text-amber-700 mb-6">분실 고양이 정보</h2>
        <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
            <!-- Thymeleaf 반복문을 사용한 동적 게시물 렌더링 -->
            <div th:each="post : ${posts}"
                 class="card bg-white rounded-lg shadow-lg overflow-hidden border-l-4 border-amber-400"
                 role="article"
                 aria-labelledby="post-title-${post.id}">
                <!-- 고양이 사진 -->
                <img th:src="${post.imageUrl}" th:alt="'분실된 고양이 ' + ${post.catName} + '의 사진'"
                     class="cat-image" th:onerror="this.src='/images/default-cat.jpg'" />
                <div class="p-6">
                    <!-- 고양이 이름 -->
                    <h3 th:id="'post-title-' + ${post.id}" th:text="${post.catName}"
                        class="text-xl font-semibold text-gray-800"></h3>
                    <!-- 분실 장소 -->
                    <p class="text-gray-600 mt-2"><strong>분실 장소:</strong> <span th:text="${post.location}"></span></p>
                    <!-- 특징 -->
                    <p class="text-gray-600 mt-2"><strong>특징:</strong> <span th:text="${post.description}"></span></p>
                    <!-- 등록일 -->
                    <p class="text-gray-500 text-sm mt-2"><strong>등록일:</strong> <span th:text="${post.createdAt}"></span></p>
                    <!-- 상세 보기 링크 -->
                    <a th:href="@{'/lostCatPosts/' + ${post.id}}"
                       class="mt-4 inline-block text-amber-600 hover:underline"
                       th:attr="aria-label=${post.catName} + ' 게시물 상세 보기'">자세히 보기</a>
                </div>
            </div>

            <!-- 게시물이 없을 경우 -->
            <div th:if="${#lists.isEmpty(posts)}" class="text-center text-gray-500 col-span-full">
                <p>아직 등록된 분실 고양이 게시물이 없습니다.</p>
            </div>
        </div>
    </section>
</main>

<!-- 푸터 -->
<footer class="bg-amber-100 p-4 text-center text-amber-700">
    <p>© 2025 분실 고양이 게시판. 모든 권리 보유.</p>
</footer>
</body>
</html>
