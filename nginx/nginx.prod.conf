user nginx;
worker_processes auto;  # CPU 코어 수만큼 자동 설정
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;        # Linux 최적화 소켓 방식
  multi_accept on;  # 한 번에 여러 연결 수락
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # JSON 로그 포맷 (ELK, CloudWatch 분석 용이)
  log_format json_combined escape=json
    '{'
      '"time_local":"$time_local",'
      '"remote_addr":"$remote_addr",'
      '"request":"$request",'
      '"status":"$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"request_time":"$request_time",'
      '"upstream_response_time":"$upstream_response_time",'
      '"http_user_agent":"$http_user_agent",'
      '"http_x_forwarded_for":"$http_x_forwarded_for"'
    '}';
  access_log /var/log/nginx/access.log json_combined;

  # 성능 최적화
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  # 보안 - Nginx 버전 숨김
  server_tokens off;

  # Gzip 압축 (JSON 응답 크기 축소)
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript;

  # 업스트림 (Spring Boot API)
  upstream api {
    server api:8080;
    keepalive 32;  # upstream 커넥션 재사용
  }

  server {
    listen 80;
    server_name _;

    # API 요청 → Spring Boot
    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;

      # 헤더 전달
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # 타임아웃
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;

      # 버퍼
      proxy_buffering on;
      proxy_buffer_size 4k;
      proxy_buffers 8 4k;
    }

    # SSE 전용 — 버퍼링 끄기 필수 (없으면 실시간 안 됨)
    location /api/notice/sse {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_cache off;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;  # SSE는 장시간 연결 유지
      chunked_transfer_encoding on;
    }

    # Spring Boot 헬스체크 (/health만 노출, actuator 전체 비노출)
    location /actuator/health {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      access_log off;
    }

    # Nginx 자체 헬스체크 (로드밸런서용)
    location /nginx-health {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }
  }
}
