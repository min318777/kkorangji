user www-data;
worker_processes auto;  # CPU 코어 수만큼 자동 설정
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;        # Linux 최적화 소켓 방식
  multi_accept on;  # 한 번에 여러 연결 수락
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # JSON 로그 포맷 (ELK, CloudWatch 분석 용이)
  log_format json_combined escape=json
    '{'
      '"time_local":"$time_local",'
      '"remote_addr":"$remote_addr",'
      '"request":"$request",'
      '"status":"$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"request_time":"$request_time",'
      '"upstream_response_time":"$upstream_response_time",'
      '"http_user_agent":"$http_user_agent",'
      '"http_x_forwarded_for":"$http_x_forwarded_for"'
    '}';
  access_log /var/log/nginx/access.log json_combined;

  # 성능 최적화
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  # 보안 - Nginx 버전 숨김
  server_tokens off;

  # Gzip 압축 (JSON 응답 크기 축소)
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript;

  # 실제 서버 블록(80/443, SSL, location)은 sites-enabled에 있다.
  # EC2는 Certbot이 발급한 SSL 설정을 sites-enabled/api.kkorangji.com에 두고 있으므로,
  # 이 nginx.conf를 EC2의 /etc/nginx/nginx.conf에 덮어쓸 경우 반드시 이 include가
  # 살아있어야 한다 — 없으면 443(HTTPS)이 통째로 사라진다.
  # sites-enabled 안의 실제 서버 블록 내용은 nginx.prod.site.conf 참고.
  include /etc/nginx/sites-enabled/*;
}