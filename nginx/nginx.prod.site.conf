# EC2 /etc/nginx/sites-enabled/api.kkorangji.com 의 실제 내용 (참고/백업용).
# Certbot이 SSL 인증서를 발급하며 자동 생성/관리하는 파일이라, EC2에서 직접
# `certbot --nginx`로 갱신하지 않는 이상 이 파일을 EC2에 그대로 복사해 덮어쓰지 말 것.
# nginx.conf(같은 디렉토리)가 이 디렉토리를 include하므로, nginx.conf만 EC2에
# 반영하면 이 서버 블록은 그대로 유지된다.

server {
    if ($host = api.kkorangji.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.kkorangji.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.kkorangji.com;
    ssl_certificate /etc/letsencrypt/live/api.kkorangji.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.kkorangji.com/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 기본값 1MB로는 /api/test/boast-posts/legacy-upload(서버 경유 업로드 비교 측정용)의
        # 대용량 동영상이 여기서 413으로 막힘 — application.yml의 multipart 크기(250MB)와 맞춤
        client_max_body_size 250M;
    }

    location /api/notifications/stream {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location /oauth2/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/oauth2/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/health {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}